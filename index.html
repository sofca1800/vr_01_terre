<style>
:root{--navy:#0a1a33;--navy2:#123057;--fg:#e8eefb;--acc:#ff7a1a;--panel:rgba(10,26,51,.9)}
html,body{height:100%;margin:0;overflow:hidden;background:linear-gradient(var(--navy2),#050d1c);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;display:none}
body.ar #v1{display:block}
body.ar.vr #v1{width:50%}
body.ar.vr #v2{display:block;left:50%;width:50%}
canvas#gl{position:fixed;inset:0;width:100%;height:100%}
#bar{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;z-index:5}
#bar .brand{display:flex;align-items:center;gap:6px;font-weight:800;letter-spacing:.12em;color:var(--fg);margin-right:auto}
#bar .brand img{height:34px;background:#f4f1ec;border-radius:8px;padding:2px 6px}
button{background:var(--panel);color:var(--fg);border:1px solid var(--acc);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600}
button.main{background:var(--acc);color:#1a0d00;border-color:var(--acc)}
#intro{position:fixed;inset:0;z-index:9;background:radial-gradient(circle at 50% 30%,var(--navy2),var(--navy) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#intro .card{background:#f4f1ec;border-radius:18px;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.45)}#intro .card img{display:block;width:min(300px,72vw);height:auto;border-radius:10px}
#intro h1{margin:0;font-size:34px;letter-spacing:.2em;color:var(--fg)}
#intro h1 b{color:var(--acc)}
#intro p{max-width:420px;margin:0;line-height:1.5;color:#b3c3df}
#intro .tag{color:var(--acc);font-weight:700;letter-spacing:.08em;font-size:13px}
</style>

  <div class="tag">MONITOREO ESTRUCTURAL EN REALIDAD AUMENTADA</div>
  <p>Fija la mirada en el edificio resaltado durante 3 segundos para disparar el sismo y ver los datos del antes y el después de la falla.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ====== CONFIG ======
const ORANGE='#ff7a1a', NAVY='rgba(10,26,51,.9)';

const $=id=>document.getElementById(id), rnd=(a,b)=>a+Math.random()*(b-a), R=THREE.MathUtils.degToRad;
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setScissorTest(true);
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(70,1,0.05,200);
cam.position.set(0,1.6,0);scene.add(cam);
scene.add(new THREE.HemisphereLight(0xcfe0ff,0x1a2740,1.1));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(5,10,3);scene.add(sun);
const city=new THREE.Group();scene.add(city);

// ====== Suelo ======
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshBasicMaterial({color:0x0c1a30,transparent:true,opacity:.5,depthWrite:false}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.01;city.add(ground);
const grid=new THREE.GridHelper(80,40,0xff7a1a,0x24406b);grid.material.transparent=true;grid.material.opacity=.4;city.add(grid);

// ====== Fachadas con ventanas ======
function facade(cols,rows,wall,lit,cw,ch){
  const c=document.createElement('canvas');c.width=cols*cw;c.height=rows*ch;const g=c.getContext('2d');
  g.fillStyle=wall;g.fillRect(0,0,c.width,c.height);
  for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){
    const x=k*cw+cw*.18,y=r*ch+ch*.2,w=cw*.64,h=ch*.6;
    g.fillStyle='#1c2638';g.fillRect(x-3,y-3,w+6,h+6);
    if(Math.random()<lit){g.fillStyle='#ffc56b';g.fillRect(x,y,w,h);}
    else{const gr=g.createLinearGradient(x,y,x+w,y+h);gr.addColorStop(0,'#7fa8d9');gr.addColorStop(1,'#16305a');g.fillStyle=gr;g.fillRect(x,y,w,h);}
    g.fillStyle='rgba(255,255,255,.28)';g.fillRect(x,y,w,2);
    g.fillStyle='#1c2638';g.fillRect(x+w/2-1,y,2,h);
  }
  g.fillStyle='rgba(0,0,0,.18)';for(let r=0;r<rows;r++)g.fillRect(0,(r+1)*ch-4,c.width,4);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;
}
const roofColor=0x5d6473;
function boxMats(side,cap){return [side,side,cap,cap,side,side];}

const WALLS=['#8d95a3','#8a92a8','#7c8a99','#a3a9b5','#94889a'];
for(let i=0;i<16;i++){const a=i/16*Math.PI*2+.2,r=rnd(20,32),h=rnd(4,14),w=rnd(3,6),d=rnd(3,6);
  const rows=Math.max(2,Math.round(h/1.6)),cols=Math.max(2,Math.round(w/1.25));
  const side=new THREE.MeshLambertMaterial({map:facade(cols,rows,WALLS[i%WALLS.length],.25,64,48)});
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),boxMats(side,new THREE.MeshLambertMaterial({color:roofColor})));
  m.position.set(Math.sin(a)*r,h/2,-Math.cos(a)*r);city.add(m);}

// ====== Edificio objetivo (6 pisos) ======
const FL=6,FH=1.6,BW=5,TZ=-14,floors=[];
const slab=new THREE.Mesh(new THREE.BoxGeometry(7.5,.12,7.5),new THREE.MeshLambertMaterial({color:0x7d8594}));
slab.position.set(0,.06,TZ);city.add(slab);
for(let i=0;i<FL;i++){
  const side=new THREE.MeshLambertMaterial({map:facade(4,1,i===0?'#a9a398':'#c9c2b6',i===0?.6:.35,128,96)});
  const m=new THREE.Mesh(new THREE.BoxGeometry(BW,FH-.06,BW),boxMats(side,new THREE.MeshLambertMaterial({color:roofColor})));
  m.userData={y0:FH/2+i*FH+.09,side:side};m.position.set(0,m.userData.y0,TZ);city.add(m);floors.push(m);}
const ac=new THREE.Mesh(new THREE.BoxGeometry(1.2,.5,1.2),new THREE.MeshLambertMaterial({color:0x4a5261}));
ac.position.set(1,1.02,-.8);floors[FL-1].add(ac);

// ====== Polvo ======
const N=400,pp=new Float32Array(N*3),pv=new Float32Array(N*3),pg=new THREE.BufferGeometry();
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0xcbb99a,size:.4,transparent:true,opacity:0,depthWrite:false}));
dust.frustumCulled=false;city.add(dust);

// ====== HUD en el mundo ======
const hc=document.createElement('canvas');hc.width=640;hc.height=400;const hx=hc.getContext('2d');
const htex=new THREE.CanvasTexture(hc);
const hud=new THREE.Mesh(new THREE.PlaneGeometry(.9,.5625),new THREE.MeshBasicMaterial({map:htex,transparent:true,depthTest:false}));
hud.position.set(0,-.33,-1);hud.renderOrder=10;cam.add(hud);
const rc=document.createElement('canvas');rc.width=rc.height=128;const rx=rc.getContext('2d');
const rtex=new THREE.CanvasTexture(rc);
const ret=new THREE.Mesh(new THREE.PlaneGeometry(.12,.12),new THREE.MeshBasicMaterial({map:rtex,transparent:true,depthTest:false}));
ret.position.set(0,0,-1);ret.renderOrder=11;cam.add(ret);

// ====== Estado ======
let state='idle',t=0,idleT=0,dwell=0,failed=false,failT=0,hist=[],acc=0,dustAge=0,vr=false;
// Sensores SIMULADOS (mismas variables que el dashboard del ESP32)
let acelX=0,despl=15,curD=.1,impacto=false,inclin=false,temp=24.6;
let preA=0,postA=0,preDp=0,postDp=0,preD=0;
const BASE=15;                                   // distancia base del ultrasónico (cm)
const EV={mag:6.8,prof:35,freq:2.1};             // parámetros del evento (como los potenciómetros)
const ray=new THREE.Raycaster();

function startQuake(){if(state!=='idle')return;state='quake';t=0;hist=[];failed=false;preA=postA=preDp=postDp=0;dwell=0;}
function reset(){state='idle';t=0;dwell=0;failed=false;hist=[];idleT=0;
  dust.material.opacity=0;city.position.set(0,0,0);
  floors.forEach(f=>{const u=f.userData;u.fall=false;f.position.set(0,u.y0,TZ);f.rotation.set(0,0,0);u.side.color.setRGB(1,1,1)});alpha0=alpha;}

function step(dt){
  cam.updateMatrixWorld();ray.setFromCamera({x:0,y:0},cam);
  const hit=state==='idle'&&ray.intersectObjects(floors,false).length>0;
  if(state==='idle'){dwell=hit?dwell+dt:Math.max(0,dwell-dt*2);if(dwell>=3)startQuake();idleT+=dt;}
  let amp=0;
  if(state==='quake'){
    t+=dt;
    amp=failed?(t<10?.42:.42*Math.exp(-(t-10))):.03+.09*t;
    const w=Math.sin(t*13)+.5*Math.sin(t*29+1)+.4*(Math.random()-.5);
    acelX=amp*9.81*w;                                        // MPU6050, eje X (m/s²)
    curD=failed?Math.min(12,3+(t-failT)*2.2):amp*8.8;        // deriva estimada (%)
    despl=BASE+curD*.4*Math.sin(t*12);                       // ultrasónico (cm)
    impacto=amp*Math.abs(w)>.15;                             // KY-002
    inclin=failed;                                           // KY-027
    if(!failed&&curD>=3){failed=true;failT=t;preD=curD;
      for(let i=0;i<N;i++){pp.set([rnd(-2.5,2.5),rnd(0,1.5),TZ+rnd(-2.5,2.5)],i*3);pv.set([rnd(-1,1),rnd(.5,2.5),rnd(-1,1)],i*3);}dustAge=0;}
    const dv=Math.abs(despl-BASE);
    if(failed){postA=Math.max(postA,Math.abs(acelX));postDp=Math.max(postDp,dv);}
    else{preA=Math.max(preA,Math.abs(acelX));preDp=Math.max(preDp,dv);}
    if(t>=13){state='done';amp=0;}
  }else if(state==='idle'){
    acelX=.05*(Math.random()-.5)*2;despl=BASE+.05*(Math.random()-.5)*2;curD=.1;impacto=false;inclin=false;
  }
  temp=24.6+.15*Math.sin(performance.now()/3000);            // DS18B20
  acc+=dt;if(acc>=.05&&state!=='done'){acc=0;hist.push({t:state==='idle'?idleT:t,a:acelX});
    if(state==='idle')while(hist[0]&&hist[0].t<idleT-7)hist.shift();}
  const k=Math.min(1,curD/3);
  floors.forEach((f,i)=>{const u=f.userData,s=u.side;
    if(failed&&i>=2&&!u.fall&&t>=failT+(i-2)*.3){u.fall=true;u.vy=0;u.vx=rnd(-1,1)*(i-1)*.5;u.vz=rnd(-.5,.5);u.wz=rnd(-1,1);u.wx=rnd(-.5,.5);}
    if(u.fall){u.vy-=9.8*dt;f.position.y+=u.vy*dt;f.position.x+=u.vx*dt;f.position.z+=u.vz*dt;f.rotation.z+=u.wz*dt;f.rotation.x+=u.wx*dt;
      const fy=.35+(i-2)*.2;if(f.position.y<fy){f.position.y=fy;u.vy*=-.15;u.vx*=.7;u.vz*=.7;u.wz*=.7;u.wx*=.7;}}
    else if(state==='quake')f.position.x=Math.sin(t*12+i)*Math.min(amp,.42)*.35*(i+1);
    if(failed)s.color.setRGB(1,.42,.36);else s.color.setRGB(1,1-.45*k,1-.7*k);
    s.emissive.setHex(hit?0x7a3a0a:0);});
  if(state==='quake'){city.position.x=Math.sin(t*25)*amp*.15;city.position.y=Math.cos(t*31)*amp*.05;}else city.position.set(0,0,0);
  if(failed){dustAge+=dt;const p=pg.attributes.position;for(let i=0;i<N*3;i++)pp[i]+=pv[i]*dt;p.needsUpdate=true;dust.material.opacity=Math.max(0,.7-dustAge*.07);}
  drawHUD();drawRet();
}

function tx(s,x,y,sz,col,al){hx.font='600 '+sz+'px system-ui,sans-serif';hx.fillStyle=col;hx.textAlign=al||'left';hx.fillText(s,x,y);}
function drawHUD(){
  const c=hx;c.clearRect(0,0,640,400);c.fillStyle=NAVY;c.fillRect(0,0,640,400);
  c.strokeStyle=ORANGE;c.lineWidth=2;c.strokeRect(1,1,638,398);
  const col=state==='idle'?'#4ade80':failed?'#ef4444':'#facc15';
  c.fillStyle=ORANGE;c.fillRect(0,0,6,36);
  tx('CENTRIX SYSTEM',16,26,19,ORANGE);tx('· datos simulados',176,26,14,'#9fb4d8');
  tx(state==='idle'?'ESTADO: NORMAL':failed?'FALLA DETECTADA':'SISMO EN CURSO',624,26,19,col,'right');
  const X=16,Y=44,CW=608,CH=110,idle=state==='idle';
  const t1=idle?idleT:13,t0=idle?idleT-6:0,sp=t1-t0,mx=v=>X+(v-t0)/sp*CW;
  c.fillStyle='rgba(255,255,255,.05)';c.fillRect(X,Y,CW,CH);
  if(failed){const fx=mx(failT);c.fillStyle='rgba(255,122,26,.12)';c.fillRect(X,Y,fx-X,CH);c.fillStyle='rgba(239,68,68,.18)';c.fillRect(fx,Y,X+CW-fx,CH);}
  c.strokeStyle=col;c.lineWidth=2;c.beginPath();
  hist.forEach((p,i)=>{const x=mx(p.t),y=Y+CH/2-Math.max(-1,Math.min(1,p.a/6))*CH/2;i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();
  tx('aceleración eje X (m/s²) · MPU6050',X+6,Y+CH-6,12,'#8ea3c7');
  if(failed){const fx=mx(failT);c.strokeStyle='#ef4444';c.lineWidth=2;c.beginPath();c.moveTo(fx,Y);c.lineTo(fx,Y+CH);c.stroke();
    tx('ANTES',X+6,Y+16,14,ORANGE);tx('DESPUÉS',X+CW-6,Y+16,14,'#f87171','right');tx('T+'+failT.toFixed(1)+' s',fx+5,Y+32,14,'#fca5a5');}
  if(!failed){
    const M=[['Aceleración X',acelX.toFixed(2)+' m/s²'],['Desplazamiento',despl.toFixed(1)+' cm'],['Deriva estimada',curD.toFixed(1)+' %']];
    M.forEach((m,i)=>{const x=16+i*206;c.fillStyle='rgba(255,255,255,.07)';c.fillRect(x,164,196,84);c.fillStyle=ORANGE;c.fillRect(x,164,196,3);tx(m[0],x+10,190,14,'#8ea3c7');tx(m[1],x+10,230,28,'#e8eefb');});
    const S=[['Impacto',impacto?'SÍ':'NO',impacto],['Inclinación',inclin?'SÍ':'NO',inclin],['Temperatura',temp.toFixed(1)+' °C',false]];
    S.forEach((m,i)=>{const x=16+i*206;c.fillStyle='rgba(255,255,255,.07)';c.fillRect(x,258,196,42);tx(m[0],x+10,285,14,'#8ea3c7');tx(m[1],x+186,286,20,m[2]?'#ef4444':'#e8eefb','right');});
    tx('Evento simulado: M '+EV.mag.toFixed(1)+' · prof. '+EV.prof+' km · f '+EV.freq.toFixed(1)+' Hz',16,332,15,'#9fb4d8');
    tx(idle?'Mira el edificio resaltado 3 s para iniciar el sismo':'Umbral de falla: deriva ≥ 3.0 %',16,368,17,'#e8eefb');
  }else{
    const rows=[['','ANTES','DESPUÉS'],['Aceleración X pico (m/s²)',preA.toFixed(1),postA.toFixed(1)],['Desplazamiento máx. (cm)',preDp.toFixed(1),postDp.toFixed(1)],
      ['Deriva estimada (%)',preD.toFixed(1),curD.toFixed(1)],['Inclinación (KY-027)','NO','SÍ']];
    rows.forEach((r,i)=>{const y=186+i*28,hd=i===0;tx(r[0],16,y,16,'#8ea3c7');tx(r[1],380,y,17,hd?ORANGE:'#e8eefb','right');tx(r[2],620,y,17,hd?'#f87171':'#fca5a5','right');});
    tx('Falla: Piso 3 · T+'+failT.toFixed(1)+' s · deriva '+preD.toFixed(1)+' % · evento M '+EV.mag.toFixed(1),16,350,15,'#fca5a5');
    if(state==='done')tx('Toca: reiniciar · Mantén: salir de modo lentes',16,384,13,'#8ea3c7');
  }
  htex.needsUpdate=true;
}
function drawRet(){rx.clearRect(0,0,128,128);rx.lineWidth=4;rx.strokeStyle='rgba(255,255,255,.85)';rx.beginPath();rx.arc(64,64,24,0,7);rx.stroke();
  rx.fillStyle='#fff';rx.beginPath();rx.arc(64,64,3,0,7);rx.fill();
  if(dwell>0){rx.strokeStyle=ORANGE;rx.lineWidth=8;rx.beginPath();rx.arc(64,64,34,-Math.PI/2,-Math.PI/2+Math.min(1,dwell/3)*Math.PI*2);rx.stroke();}
  rtex.needsUpdate=true;}

// ====== Orientación ======
let gyro=false,alpha=0,beta=0,gamma=0,alpha0=0,yaw=0,pitch=0;
addEventListener('deviceorientation',e=>{if(e.alpha==null)return;gyro=true;alpha=e.alpha;beta=e.beta;gamma=e.gamma;});
const q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),q0=new THREE.Quaternion(),eu=new THREE.Euler(),zee=new THREE.Vector3(0,0,1);
function updateCam(){
  if(gyro){const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    eu.set(R(beta),R(alpha-alpha0),-R(gamma),'YXZ');cam.quaternion.setFromEuler(eu).multiply(q1).multiply(q0.setFromAxisAngle(zee,-R(so)));}
  else{eu.set(pitch,yaw,0,'YXZ');cam.quaternion.setFromEuler(eu);}
  cam.position.set(state==='quake'?Math.sin(t*20)*.01:0,1.6,0);
}
let drag=null,hold=null;
addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};
  if(vr)hold=setTimeout(()=>{hold=null;toggleVR();},700);});
addEventListener('pointermove',e=>{if(!drag||gyro)return;yaw-=(e.clientX-drag.x)*.005;pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-drag.y)*.005));drag={x:e.clientX,y:e.clientY};});
addEventListener('pointerup',()=>{drag=null;if(hold){clearTimeout(hold);hold=null;if(vr&&state==='done')reset();}});

// ====== Cámara, estéreo y permisos ======
let stream=null;
async function toggleAR(on){
  if(on){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    $('v1').srcObject=stream;$('v2').srcObject=stream;document.body.classList.add('ar');}catch(e){alert('No se pudo abrir la cámara: '+e.message);}}
  else{if(stream)stream.getTracks().forEach(x=>x.stop());stream=null;document.body.classList.remove('ar');}
}
function toggleVR(){vr=!vr;document.body.classList.toggle('vr',vr);$('bar').style.display=vr?'none':'flex';
  try{if(vr){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}
  else if(document.fullscreenElement)document.exitFullscreen();}catch(e){}resize();}
async function start(ar){
  try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission();
      if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission();}catch(e){}
  $('intro').style.display='none';setTimeout(()=>{alpha0=alpha;},500);if(ar)toggleAR(true);
}
$('go1').onclick=()=>start(true);$('go2').onclick=()=>start(false);
$('bAR').onclick=()=>toggleAR(!stream);$('bVR').onclick=toggleVR;$('bQ').onclick=startQuake;$('bR').onclick=reset;

function resize(){renderer.setSize(innerWidth,innerHeight,false);
  const a=vr?innerWidth/2/innerHeight:innerWidth/innerHeight;hud.scale.setScalar(Math.min(1,a*1.4/.9));}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);updateCam();step(dt);
  const w=innerWidth,h=innerHeight;
  if(!vr){cam.aspect=w/h;cam.updateProjectionMatrix();renderer.setViewport(0,0,w,h);renderer.setScissor(0,0,w,h);renderer.render(scene,cam);}
  else{cam.aspect=w/2/h;cam.updateProjectionMatrix();
    for(let e=0;e<2;e++){const s=e?.032:-.032;renderer.setViewport(e*w/2,0,w/2,h);renderer.setScissor(e*w/2,0,w/2,h);
      cam.translateX(s);cam.updateMatrixWorld(true);renderer.render(scene,cam);cam.translateX(-s);cam.updateMatrixWorld(true);}}
}
loop();
</script></body></html>
