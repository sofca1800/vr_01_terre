<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SismoLens AR</title>
<style>
:root{--fg:#e6f1ff;--acc:#22d3ee;--panel:rgba(8,16,30,.88)}
html,body{height:100%;margin:0;overflow:hidden;background:linear-gradient(#1e3a5f,#0b1220);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;display:none}
body.ar #v1{display:block}
body.ar.vr #v1{width:50%}
body.ar.vr #v2{display:block;left:50%;width:50%}
canvas#gl{position:fixed;inset:0;width:100%;height:100%}
#bar{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;z-index:5}
button{background:var(--panel);color:var(--fg);border:1px solid var(--acc);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600}
button.main{background:var(--acc);color:#04202a}
#intro{position:fixed;inset:0;z-index:9;background:#0b1220;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#intro h1{margin:0;font-size:28px;color:var(--acc)}
#intro p{max-width:420px;margin:0;line-height:1.5;color:#b6c8e0}
</style></head><body>
<video id="v1" autoplay muted playsinline></video>
<video id="v2" autoplay muted playsinline></video>
<canvas id="gl"></canvas>
<div id="bar">
  <button id="bAR">📷 Cámara AR</button>
  <button id="bVR">🥽 Modo lentes</button>
  <button id="bQ">▶ Sismo</button>
  <button id="bR">↺ Reiniciar</button>
</div>
<div id="intro">
  <h1>SismoLens AR</h1>
  <p>Monitoreo estructural en realidad aumentada. Fija la mirada en el edificio resaltado durante 3 segundos para disparar el sismo y ver los datos del antes y el después de la falla.</p>
  <button class="main" id="go1">Iniciar con cámara AR</button>
  <button id="go2">Iniciar sin cámara</button>
  <p style="font-size:13px">Usa Chrome/Safari con HTTPS. Para los lentes: gira el celular en horizontal y pulsa "Modo lentes".</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id), rnd=(a,b)=>a+Math.random()*(b-a), R=THREE.MathUtils.degToRad;
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setScissorTest(true);
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(70,1,0.05,200);
cam.position.set(0,1.6,0);scene.add(cam);
scene.add(new THREE.HemisphereLight(0xcfe8ff,0x223344,1.1));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(5,10,3);scene.add(sun);
const city=new THREE.Group();scene.add(city);
const grid=new THREE.GridHelper(80,40,0x22d3ee,0x1e4a66);grid.material.transparent=true;grid.material.opacity=.55;city.add(grid);
for(let i=0;i<16;i++){const a=i/16*Math.PI*2+.2,r=rnd(20,32),h=rnd(4,14);
  const m=new THREE.Mesh(new THREE.BoxGeometry(rnd(3,6),h,rnd(3,6)),new THREE.MeshLambertMaterial({color:0x3b4a63,transparent:true,opacity:.9}));
  m.position.set(Math.sin(a)*r,h/2,-Math.cos(a)*r);city.add(m);}
// Edificio objetivo (6 pisos)
const FL=6,FH=1.6,BW=5,TZ=-14,floors=[];
for(let i=0;i<FL;i++){const g=new THREE.BoxGeometry(BW,FH-.06,BW);
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0x2dd4bf,transparent:true,opacity:.88}));
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0xffffff})));
  m.userData={y0:FH/2+i*FH+.03};m.position.set(0,m.userData.y0,TZ);city.add(m);floors.push(m);}
// Polvo
const N=400,pp=new Float32Array(N*3),pv=new Float32Array(N*3),pg=new THREE.BufferGeometry();
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0xcbb99a,size:.4,transparent:true,opacity:0,depthWrite:false}));
dust.frustumCulled=false;city.add(dust);
// HUD en el mundo (se ve en ambos ojos)
const hc=document.createElement('canvas');hc.width=640;hc.height=400;const hx=hc.getContext('2d');
const htex=new THREE.CanvasTexture(hc);
const hud=new THREE.Mesh(new THREE.PlaneGeometry(.9,.5625),new THREE.MeshBasicMaterial({map:htex,transparent:true,depthTest:false}));
hud.position.set(0,-.33,-1);hud.renderOrder=10;cam.add(hud);
const rc=document.createElement('canvas');rc.width=rc.height=128;const rx=rc.getContext('2d');
const rtex=new THREE.CanvasTexture(rc);
const ret=new THREE.Mesh(new THREE.PlaneGeometry(.12,.12),new THREE.MeshBasicMaterial({map:rtex,transparent:true,depthTest:false}));
ret.position.set(0,0,-1);ret.renderOrder=11;cam.add(ret);

// Estado
let state='idle',t=0,idleT=0,dwell=0,failed=false,failT=0,hist=[],acc=0,dustAge=0,vr=false;
let curA=0,curD=.1,curF=2.1,preA=0,preD=0,postA=0,postD=0,realA=0;
const ray=new THREE.Raycaster();

function startQuake(){if(state!=='idle')return;state='quake';t=0;hist=[];failed=false;preA=postA=0;dwell=0;}
function reset(){state='idle';t=0;dwell=0;failed=false;hist=[];idleT=0;dust.material.opacity=0;city.position.set(0,0,0);
  floors.forEach(f=>{const u=f.userData;u.fall=false;f.position.set(0,u.y0,TZ);f.rotation.set(0,0,0);f.material.color.set(0x2dd4bf)});alpha0=alpha;}

function step(dt){
  cam.updateMatrixWorld();ray.setFromCamera({x:0,y:0},cam);
  const hit=state==='idle'&&ray.intersectObjects(floors,false).length>0;
  if(state==='idle'){dwell=hit?dwell+dt:Math.max(0,dwell-dt*2);if(dwell>=3)startQuake();idleT+=dt;}
  floors.forEach(f=>f.material.emissive.setHex(hit?0x0a6a80:0));
  let amp=0;
  if(state==='quake'){
    t+=dt;
    amp=failed?(t<10?.42:.42*Math.exp(-(t-10))):.03+.09*t;
    curA=amp*(Math.sin(t*13)+.5*Math.sin(t*29+1)+.4*(Math.random()-.5));
    curD=failed?Math.min(12,3+(t-failT)*2.2):amp*8.8;
    curF=failed?Math.max(.8,2.1-(t-failT)*1.5):2.1-curD*.02;
    if(!failed&&curD>=3){failed=true;failT=t;preD=curD;
      for(let i=0;i<N;i++){pp.set([rnd(-2.5,2.5),rnd(0,1.5),TZ+rnd(-2.5,2.5)],i*3);pv.set([rnd(-1,1),rnd(.5,2.5),rnd(-1,1)],i*3);}dustAge=0;}
    if(failed)postA=Math.max(postA,Math.abs(curA));else preA=Math.max(preA,Math.abs(curA));
    if(t>=13){state='done';amp=0;}
  }else if(state==='idle'){curA=realA+.003*(Math.random()-.5)*2;curD=.1;curF=2.1;}
  acc+=dt;if(acc>=.05&&state!=='done'){acc=0;hist.push({t:state==='idle'?idleT:t,a:curA});
    if(state==='idle')while(hist[0]&&hist[0].t<idleT-7)hist.shift();}
  // Edificio
  floors.forEach((f,i)=>{const u=f.userData;
    if(failed&&i>=2&&!u.fall&&t>=failT+(i-2)*.3){u.fall=true;u.vy=0;u.vx=rnd(-1,1)*(i-1)*.5;u.vz=rnd(-.5,.5);u.wz=rnd(-1,1);u.wx=rnd(-.5,.5);}
    if(u.fall){u.vy-=9.8*dt;f.position.y+=u.vy*dt;f.position.x+=u.vx*dt;f.position.z+=u.vz*dt;f.rotation.z+=u.wz*dt;f.rotation.x+=u.wx*dt;
      const fy=.35+(i-2)*.2;if(f.position.y<fy){f.position.y=fy;u.vy*=-.15;u.vx*=.7;u.vz*=.7;u.wz*=.7;u.wx*=.7;}}
    else if(state==='quake')f.position.x=Math.sin(t*12+i)*Math.min(amp,.42)*.35*(i+1);
    f.material.color.setHSL(failed?0:.45*(1-Math.min(1,curD/3)),.75,.5);});
  if(state==='quake'){city.position.x=Math.sin(t*25)*amp*.15;city.position.y=Math.cos(t*31)*amp*.05;}else city.position.set(0,0,0);
  if(failed){dustAge+=dt;const p=pg.attributes.position;for(let i=0;i<N*3;i++)pp[i]+=pv[i]*dt;p.needsUpdate=true;dust.material.opacity=Math.max(0,.7-dustAge*.07);}
  drawHUD();drawRet();
}

function tx(s,x,y,sz,col,al){hx.font='600 '+sz+'px system-ui,sans-serif';hx.fillStyle=col;hx.textAlign=al||'left';hx.fillText(s,x,y);}
function drawHUD(){
  const c=hx;c.clearRect(0,0,640,400);c.fillStyle='rgba(8,16,30,.85)';c.fillRect(0,0,640,400);
  c.strokeStyle='#22d3ee';c.lineWidth=2;c.strokeRect(1,1,638,398);
  const col=state==='idle'?'#22c55e':failed?'#ef4444':'#f59e0b';
  tx('SISMOLENS · Edificio A-3 (datos simulados)',16,28,19,'#7dd3fc');
  tx(state==='idle'?'ESTADO: NORMAL':failed?'FALLA DETECTADA':'SISMO EN CURSO',624,28,19,col,'right');
  const X=16,Y=44,CW=608,CH=140,live=state==='idle';
  const t1=live?idleT:13,t0=live?idleT-6:0,sp=t1-t0,mx=v=>X+(v-t0)/sp*CW;
  c.fillStyle='rgba(255,255,255,.05)';c.fillRect(X,Y,CW,CH);
  if(failed){const fx=mx(failT);c.fillStyle='rgba(34,211,238,.12)';c.fillRect(X,Y,fx-X,CH);c.fillStyle='rgba(239,68,68,.16)';c.fillRect(fx,Y,X+CW-fx,CH);}
  c.strokeStyle=col;c.lineWidth=2;c.beginPath();
  hist.forEach((p,k)=>{const x=mx(p.t),y=Y+CH/2-Math.max(-1,Math.min(1,p.a/.6))*CH/2;k?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();
  tx('aceleración (g)',X+6,Y+CH-6,13,'#7f93ad');
  if(failed){const fx=mx(failT);c.strokeStyle='#ef4444';c.lineWidth=2;c.beginPath();c.moveTo(fx,Y);c.lineTo(fx,Y+CH);c.stroke();
    tx('ANTES',X+6,Y+16,14,'#22d3ee');tx('DESPUÉS',X+CW-6,Y+16,14,'#f87171','right');tx('T+'+failT.toFixed(1)+' s',fx+5,Y+32,14,'#fca5a5');}
  if(!failed){
    const M=[['Aceleración',Math.abs(curA).toFixed(3)+' g'],['Deriva entre pisos',curD.toFixed(1)+' %'],['Frecuencia',curF.toFixed(1)+' Hz']];
    M.forEach((m,i)=>{const x=16+i*206;c.fillStyle='rgba(255,255,255,.06)';c.fillRect(x,200,196,100);tx(m[0],x+10,224,15,'#7f93ad');tx(m[1],x+10,272,32,'#e6f1ff');});
    tx('Sensor real del celular: '+realA.toFixed(3)+' g',16,330,16,'#7dd3fc');
    tx(state==='idle'?'Mira el edificio resaltado 3 s para iniciar el sismo':'Umbral de falla: deriva ≥ 3.0 %',16,368,17,'#e6f1ff');
  }else{
    const rows=[['','ANTES','DESPUÉS'],['Aceleración pico',preA.toFixed(2)+' g',postA.toFixed(2)+' g'],['Deriva entre pisos',preD.toFixed(1)+' %',curD.toFixed(1)+' %'],
      ['Frecuencia natural','2.1 Hz',curF.toFixed(1)+' Hz'],['Esfuerzo cortante',(preD*11).toFixed(0)+' MPa',(curD*11).toFixed(0)+' MPa']];
    rows.forEach((r,i)=>{const y=212+i*28,h=i===0;tx(r[0],16,y,16,'#7f93ad');tx(r[1],330,y,17,h?'#22d3ee':'#e6f1ff','right');tx(r[2],620,y,17,h?'#f87171':'#fca5a5','right');});
    tx('Falla: Piso 3 · cortante · T+'+failT.toFixed(1)+' s · deriva '+preD.toFixed(1)+' %',16,368,16,'#fca5a5');
    if(state==='done')tx('Toca: reiniciar · Mantén: salir de modo lentes',16,390,13,'#7f93ad');
  }
  htex.needsUpdate=true;
}
function drawRet(){rx.clearRect(0,0,128,128);rx.lineWidth=4;rx.strokeStyle='rgba(255,255,255,.85)';rx.beginPath();rx.arc(64,64,24,0,7);rx.stroke();
  rx.fillStyle='#fff';rx.beginPath();rx.arc(64,64,3,0,7);rx.fill();
  if(dwell>0){rx.strokeStyle='#22d3ee';rx.lineWidth=8;rx.beginPath();rx.arc(64,64,34,-Math.PI/2,-Math.PI/2+Math.min(1,dwell/3)*Math.PI*2);rx.stroke();}
  rtex.needsUpdate=true;}

// Orientación (giroscopio) o arrastre
let gyro=false,alpha=0,beta=0,gamma=0,alpha0=0,yaw=0,pitch=0;
addEventListener('deviceorientation',e=>{if(e.alpha==null)return;gyro=true;alpha=e.alpha;beta=e.beta;gamma=e.gamma;});
addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
  const m=Math.abs(Math.hypot(a.x,a.y,a.z)-9.81)/9.81;realA=realA*.85+m*.15;});
const q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),q0=new THREE.Quaternion(),eu=new THREE.Euler(),zee=new THREE.Vector3(0,0,1);
function updateCam(){
  if(gyro){const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    eu.set(R(beta),R(alpha-alpha0),-R(gamma),'YXZ');cam.quaternion.setFromEuler(eu).multiply(q1).multiply(q0.setFromAxisAngle(zee,-R(so)));}
  else{eu.set(pitch,yaw,0,'YXZ');cam.quaternion.setFromEuler(eu);}
  cam.position.set(state==='quake'?Math.sin(t*20)*.01:0,1.6,0);
}
let drag=null,hold=null;
addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};
  if(vr)hold=setTimeout(()=>{hold=null;toggleVR();},700);});
addEventListener('pointermove',e=>{if(!drag||gyro)return;yaw-=(e.clientX-drag.x)*.005;pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-drag.y)*.005));drag={x:e.clientX,y:e.clientY};});
addEventListener('pointerup',()=>{drag=null;if(hold){clearTimeout(hold);hold=null;if(vr&&state==='done')reset();}});

// Cámara, estéreo y permisos
let stream=null;
async function toggleAR(on){
  if(on){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    $('v1').srcObject=stream;$('v2').srcObject=stream;document.body.classList.add('ar');}catch(e){alert('No se pudo abrir la cámara: '+e.message);}}
  else{if(stream)stream.getTracks().forEach(x=>x.stop());stream=null;document.body.classList.remove('ar');}
}
function toggleVR(){vr=!vr;document.body.classList.toggle('vr',vr);$('bar').style.display=vr?'none':'flex';
  try{if(vr){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}
  else if(document.fullscreenElement)document.exitFullscreen();}catch(e){}resize();}
async function start(ar){
  try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission();
      if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission();}catch(e){}
  $('intro').style.display='none';setTimeout(()=>{alpha0=alpha;},500);if(ar)toggleAR(true);
}
$('go1').onclick=()=>start(true);$('go2').onclick=()=>start(false);
$('bAR').onclick=()=>toggleAR(!stream);$('bVR').onclick=toggleVR;$('bQ').onclick=startQuake;$('bR').onclick=reset;

function resize(){renderer.setSize(innerWidth,innerHeight,false);
  const a=vr?innerWidth/2/innerHeight:innerWidth/innerHeight;hud.scale.setScalar(Math.min(1,a*1.4/.9));}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);updateCam();step(dt);
  const w=innerWidth,h=innerHeight;
  if(!vr){cam.aspect=w/h;cam.updateProjectionMatrix();renderer.setViewport(0,0,w,h);renderer.setScissor(0,0,w,h);renderer.render(scene,cam);}
  else{cam.aspect=w/2/h;cam.updateProjectionMatrix();
    for(let e=0;e<2;e++){const s=e?.032:-.032;renderer.setViewport(e*w/2,0,w/2,h);renderer.setScissor(e*w/2,0,w/2,h);
      cam.translateX(s);cam.updateMatrixWorld(true);renderer.render(scene,cam);cam.translateX(-s);cam.updateMatrixWorld(true);}}
}
loop();
</script></body></html>
